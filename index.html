<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pelisme</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <!-- Classic scripts: expose the globals consumed by the ES module app. -->
  <script src="js/config.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/match.js"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen antialiased">

  <!-- ============================================================== login -->
  <div id="login-view" class="hidden min-h-screen flex items-center justify-center px-6">
    <form id="login-form" class="w-full max-w-sm bg-slate-900/80 border border-slate-800 rounded-2xl p-8 shadow-2xl">
      <h1 class="text-3xl font-extrabold tracking-tight text-center mb-1">Pelisme</h1>
      <p class="text-slate-400 text-sm text-center mb-8">Tu biblioteca de películas y series</p>

      <label class="block text-sm font-medium text-slate-300 mb-1" for="login-username">Usuario</label>
      <input id="login-username" name="username" type="text" autocomplete="username" required
        class="w-full mb-4 rounded-lg bg-slate-800 border border-slate-700 px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-600 focus:border-transparent"
        placeholder="Tu usuario">

      <label class="block text-sm font-medium text-slate-300 mb-1" for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required
        class="w-full mb-6 rounded-lg bg-slate-800 border border-slate-700 px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-600 focus:border-transparent"
        placeholder="••••••••">

      <p id="login-error" class="hidden text-sm text-rose-400 mb-4"></p>

      <button type="submit" id="login-submit"
        class="w-full rounded-lg bg-rose-600 hover:bg-rose-500 active:bg-rose-700 transition-colors font-semibold py-2.5">
        Entrar
      </button>
    </form>
  </div>

  <!-- ========================================================== app shell -->
  <div id="app-shell" class="hidden">

    <header class="sticky top-0 z-30 bg-[#0f172a]/90 backdrop-blur border-b border-slate-800">
      <div class="max-w-5xl mx-auto flex items-center justify-between px-4 h-14">
        <span class="text-xl font-extrabold tracking-tight">Peli<span class="text-rose-500">sme</span></span>
        <button id="signout-btn" title="Cerrar sesión" aria-label="Cerrar sesión"
          class="p-2 rounded-full text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
          </svg>
        </button>
      </div>
    </header>

    <main id="main-content" class="main-content max-w-5xl mx-auto px-4 pt-5">

      <!-- ====================================================== Descubrir -->
      <section id="tab-descubrir" class="tab-section">
        <div class="relative mb-6" id="search-wrapper">
          <input id="search-input" type="search" autocomplete="off"
            class="w-full rounded-xl bg-slate-900 border border-slate-700 px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-rose-600 focus:border-transparent"
            placeholder="Buscar películas y series...">
          <div id="search-dropdown"
            class="dropdown hidden absolute left-0 right-0 mt-2 z-40 rounded-xl bg-slate-900 border border-slate-700 shadow-2xl overflow-hidden"></div>
        </div>

        <h2 class="text-lg font-bold mb-3 text-slate-200">Tendencias de hoy</h2>
        <div id="trending-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>

        <button id="roulette-fab"
          class="fab fixed right-4 z-40 rounded-full bg-rose-600 hover:bg-rose-500 active:scale-95 transition-all font-bold px-5 py-3.5 shadow-lg shadow-rose-900/50">
          🎲 ¡Sorprendeme!
        </button>
      </section>

      <!-- ========================================================= Vistos -->
      <section id="tab-vistos" class="tab-section hidden">
        <h2 class="text-lg font-bold mb-3 text-slate-200">Lo que ya vimos</h2>
        <div id="vistos-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
      </section>

      <!-- ====================================================== Watchlist -->
      <section id="tab-watchlist" class="tab-section hidden">
        <h2 class="text-lg font-bold mb-3 text-slate-200">Pendientes</h2>
        <div id="watchlist-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
      </section>

      <!-- ========================================================= Mi Top -->
      <section id="tab-mitop" class="tab-section hidden">
        <h2 class="text-lg font-bold mb-3 text-slate-200">Nuestras joyas</h2>
        <div id="mitop-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
      </section>

      <!-- ==================================================== Recomendados -->
      <section id="tab-recomendados" class="tab-section hidden">
        <h2 class="text-lg font-bold mb-3 text-slate-200">Elegidos para ustedes</h2>
        <div id="recomendados-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
      </section>
    </main>

    <!-- ======================================================== bottom nav -->
    <nav class="bottom-nav fixed bottom-0 left-0 right-0 z-30 bg-slate-900/95 backdrop-blur border-t border-slate-800">
      <div class="max-w-5xl mx-auto grid grid-cols-5 h-16">
        <button class="nav-btn flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition-colors" data-tab="descubrir">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.5 8.5l-2 5-5 2 2-5 5-2z" />
          </svg>
          <span>Descubrir</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition-colors" data-tab="vistos">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Vistos</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition-colors" data-tab="watchlist">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
          </svg>
          <span>Watchlist</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition-colors" data-tab="mitop">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
          </svg>
          <span>Mi Top</span>
        </button>
        <button class="nav-btn flex flex-col items-center justify-center gap-0.5 text-[11px] font-medium transition-colors" data-tab="recomendados">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456z" />
          </svg>
          <span>Recomendados</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Modal + toast mount points -->
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[60] flex flex-col items-center gap-2 pointer-events-none"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
